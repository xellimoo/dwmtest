# edwm theme: paper - warm light palette (solarized light family)
[palette]
bg      = #FDF6E3
fg      = #4E4E4E
bright  = #FFFFFF
accent  = #B58900
border  = #E4DCC3
urgent  = #CB4B16
muted   = #9E9E9E

[scheme]
norm    = fg, bg, border
sel     = bright, accent, accent
tagsel  = bright, accent, accent
tasksel = bright, accent, accent
urg     = bg, urgent, urgent
hid     = muted, bg, border
status  = muted, bg, border

dmenu_nb = #FDF6E3
dmenu_nf = #4E4E4E
dmenu_sb = #B58900
dmenu_sf = #FFFFFF
