# edwm theme: dark
[palette]
bg      = #1a1a1a
fg      = #bbbbbb
bright  = #eeeeee
accent  = #2f4a5f
border  = #3a3a3a
urgent  = #ff5555
muted   = #666666

[scheme]
norm    = fg, bg, border
sel     = bright, accent, accent
tagsel  = bright, accent, accent
tasksel = bright, accent, accent
urg     = bg, urgent, urgent
hid     = muted, bg, border
status  = fg, bg, border

dmenu_nb = #1a1a1a
dmenu_nf = #bbbbbb
dmenu_sb = #2f4a5f
dmenu_sf = #eeeeee
