# edwm theme: solarized dark (ethanschoonover.com/solarized)
[palette]
bg      = #002B36
fg      = #93A1A1
bright  = #FDF6E3
accent  = #268BD2
border  = #073642
urgent  = #DC322F
muted   = #586E75

[scheme]
norm    = fg, bg, border
sel     = bright, accent, accent
tagsel  = bright, accent, accent
tasksel = bright, accent, accent
urg     = bg, urgent, urgent
hid     = muted, bg, border
status  = muted, bg, border

dmenu_nb = #002B36
dmenu_nf = #93A1A1
dmenu_sb = #268BD2
dmenu_sf = #FDF6E3
