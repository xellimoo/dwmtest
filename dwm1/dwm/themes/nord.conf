# edwm theme: nord (nordtheme.github.io palette)
[palette]
bg      = #2E3440
fg      = #D8DEE9
bright  = #ECEFF4
accent  = #88C0D0
border  = #4C566A
urgent  = #BF616A
muted   = #616E88

[scheme]
norm    = fg, bg, border
sel     = bg, accent, accent
tagsel  = bg, accent, accent
tasksel = bg, accent, accent
urg     = bg, urgent, urgent
hid     = muted, bg, border
status  = muted, bg, border

dmenu_nb = #2E3440
dmenu_nf = #D8DEE9
dmenu_sb = #88C0D0
dmenu_sf = #2E3440
