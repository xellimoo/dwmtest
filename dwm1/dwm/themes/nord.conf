# edwm theme: nord (nordtheme.github.io palette)
[palette]
bg      = #2e3440
fg      = #d8dee9
bright  = #eceff4
accent  = #5e81ac
border  = #4c566a
urgent  = #bf616a
muted   = #4c566a
ice     = #88c0d0

[scheme]
norm    = fg, bg, border
sel     = bright, accent, accent
tagsel  = bright, accent, ice
tasksel = bright, accent, accent
urg     = bg, urgent, urgent
hid     = muted, bg, border
status  = fg, bg, border

dmenu_nb = #2e3440
dmenu_nf = #d8dee9
dmenu_sb = #5e81ac
dmenu_sf = #eceff4
