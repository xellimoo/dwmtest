# edwm theme: gruvbox dark (github.com/morhetz/gruvbox palette)
[palette]
bg      = #282828
fg      = #EBDBB2
bright  = #FBF1C7
accent  = #458588
border  = #504945
urgent  = #CC241D
muted   = #928374

[scheme]
norm    = fg, bg, border
sel     = bright, accent, accent
tagsel  = bright, accent, accent
tasksel = bright, accent, accent
urg     = bg, urgent, urgent
hid     = muted, bg, border
status  = muted, bg, border

dmenu_nb = #282828
dmenu_nf = #EBDBB2
dmenu_sb = #458588
dmenu_sf = #FBF1C7
