# edwm theme: light - cool light palette, proving the system is not dark-only
[palette]
bg      = #FAFAFA
fg      = #37474F
bright  = #FFFFFF
accent  = #1976D2
border  = #CFD8DC
urgent  = #D32F2F
muted   = #90A4AE

[scheme]
norm    = fg, bg, border
task    = fg, border, border
sel     = bright, accent, accent
tagsel  = bright, accent, accent
tasksel = bright, accent, accent
urg     = bg, urgent, urgent
hid     = muted, bg, border
status  = muted, bg, border

dmenu_nb = #FAFAFA
dmenu_nf = #37474F
dmenu_sb = #1976D2
dmenu_sf = #FFFFFF
