# edwm theme: light
[palette]
bg      = #eeeeee
fg      = #333333
bright  = #ffffff
accent  = #3573a0
border  = #b0b0b0
urgent  = #cc2222
muted   = #999999

[scheme]
norm    = fg, bg, border
sel     = bright, accent, accent
tagsel  = bright, accent, accent
tasksel = bright, accent, accent
urg     = bright, urgent, urgent
hid     = muted, bg, border
status  = fg, bg, border

dmenu_nb = #eeeeee
dmenu_nf = #333333
dmenu_sb = #3573a0
dmenu_sf = #ffffff
