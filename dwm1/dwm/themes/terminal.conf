# edwm theme: terminal - dark console look with a green accent,
# derived from a screenshot of a dark terminal session
[palette]
bg      = #1c1c1c
bar     = #202020
fg      = #c8c8c8
bright  = #e8e8e8
dim     = #7a7a7a
accent  = #6ab04c
urgent  = #d75f5f
border  = #3a3a3a

[scheme]
norm    = fg, bg, border
sel     = bright, accent, accent
tagsel  = bright, accent, accent
tasksel = bright, accent, accent
urg     = bg, urgent, urgent
hid     = dim, bg, border
status  = fg, bar, border

dmenu_nb = #1c1c1c
dmenu_nf = #c8c8c8
dmenu_sb = #6ab04c
dmenu_sf = #1c1c1c
